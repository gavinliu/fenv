name: Update Flutter versions

on:
  schedule:
    - cron: '0 4,16 * * *' # 12:00 and 00:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flutter-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Refresh and publish version definitions
        shell: bash
        run: |
          set -euo pipefail
          definitions=share/flutter-build/versions.tsv
          upstream_tags="$RUNNER_TEMP/flutter-tags.txt"
          ohos_tags="$RUNNER_TEMP/flutter-ohos-tags.txt"

          git ls-remote --tags https://github.com/flutter/flutter.git > "$upstream_tags"
          git ls-remote --tags https://gitcode.com/CPF-Flutter/flutter_flutter.git > "$ohos_tags"
          tools/update-definitions "$upstream_tags" "$ohos_tags"

          if git diff --quiet -- "$definitions"; then
            echo "Flutter version definitions are up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$definitions"
          git commit -m 'Update Flutter version definitions'
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
